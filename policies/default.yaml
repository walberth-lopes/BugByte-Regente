# Regras do Policy Engine.
#
# Default e DENY: acao sem regra que a permita nao acontece. As regras abaixo
# abrem o que precisa estar aberto, e nada alem.
#
# Vence o mais restritivo. Se qualquer regra diz DENY, o veredito e DENY --
# ordem no arquivo nao decide seguranca.
#
# Campos que podem aparecer em `match` (ausente = curinga):
#   action environment resource organization client workspace project agent risk

rules:
  # ---- leitura: aberta ---------------------------------------------------
  - name: read_anything
    effect: ALLOW
    match: {action: "*.read"}
    reason: "ler nunca muda o mundo"

  - name: read_tasks
    effect: ALLOW
    match: {action: "task.read*"}

  # ---- trabalho no proprio workspace -------------------------------------
  - name: write_in_own_area
    effect: ALLOW
    match: {action: "workspace.write*"}
    reason: "a area do worker e isolada e descartavel"

  - name: write_code
    effect: ALLOW
    match: {action: ["repo.branch*", "repo.commit*"]}

  # ---- entrega -----------------------------------------------------------
  - name: publish_work
    effect: ALLOW
    match: {action: ["repo.push*", "repo.pr*"]}
    reason: "PR e a superficie onde um humano ve o trabalho antes de valer"

  - name: comment_and_transition
    effect: ALLOW
    match: {action: "task.write*"}

  # ---- decisao humana ----------------------------------------------------
  # Permite que uma PESSOA autenticada responda a fila de escalada. Nao e
  # permissao para um agente aprovar a si mesmo: `approval.decide` so e emitido
  # pelo caminho de decisao humana, que antes disto ja exigiu identidade provada
  # e autoridade concedida naquele workspace. Policy permite; ela nao concede.
  #
  # Sem esta regra o default DENY vale, e a fila de escalada nao pode ser
  # respondida por ninguem -- que foi o estado em que este arquivo ficou ate o
  # comando `regente decide` voltar a funcionar e mostrar a recusa.
  - name: human_decides_escalations
    effect: ALLOW
    match: {action: "approval.decide"}
    reason: "responder a fila e trabalho de gente; sem isto a fila e um beco"

  # ---- administracao de acesso -------------------------------------------
  # Permite que a acao seja avaliada. NAO concede acesso a ninguem: quem concede
  # e uma concessao gravada, e ela precisa existir ANTES de a policy ser
  # consultada. Policy permite; concessao concede. As duas precisam passar.
  #
  # Sem estas regras o default DENY vale e o acesso nunca pode ser administrado
  # -- o mesmo beco em que `approval.decide` ficou ate o marco anterior.
  # Administrar CREDENCIAIS e separado de administrar PESSOAS: quem entra na
  # equipe nao ganha, por tabela, o direito de apontar para onde os segredos do
  # cliente vivem. A regra permite que a acao seja avaliada; quem concede
  # continua sendo uma concessao gravada com a capacidade correspondente.
  - name: human_keeps_credentials
    effect: ALLOW
    match: {action: ["workspace.credential.grant",
                     "workspace.credential.revoke",
                     "workspace.credential.list",
                     "workspace.credential.use"]}
    reason: "credencial precisa de dono nomeado, com validade e revogacao"

  - name: human_administers_access
    effect: ALLOW
    match: {action: ["workspace.access.grant", "workspace.access.revoke",
                     "workspace.access.list"]}
    reason: "quem administra acesso e uma pessoa com concessao para isso"

  # ---- staging: autonomo -------------------------------------------------
  - name: merge_and_deploy_staging
    effect: ALLOW
    match: {action: ["repo.merge", "deploy.staging"], environment: ["staging", "local", "test"]}
    reason: "staging existe para quebrar; esperar assinatura aqui e o gargalo que o motor remove"

  # ---- producao: autoridade humana ---------------------------------------
  # Nao e desconfianca do modelo: e onde a organizacao decidiu que a assinatura
  # tem dono. Risco alto NAO entra aqui -- risco compra releitura, nao espera.
  - name: production_needs_signature
    effect: HUMAN_APPROVAL
    match: {action: ["repo.merge", "deploy.*", "cloud.write*"], environment: ["prod", "production", "producao"]}
    reason: "mudanca em producao tem dono humano"

  # ---- proibido ----------------------------------------------------------
  # DENY, e nao HUMAN_APPROVAL, porque nao existe circunstancia em que o motor
  # deva executar isto -- nem com autorizacao. Quem precisa faz com as maos.
  - name: never_destroys_data
    effect: DENY
    match: {action: ["db.write*", "db.drop*", "db.delete*", "*.destroy", "*.purge", "*.truncate"]}
    reason: "o motor nao escreve em banco; migration passa por deploy, com revisao"

  - name: never_touches_credentials
    effect: DENY
    match: {resource: ["*secret*", "*credential*", "*iam*", "*.env*"]}
    reason: "credencial e infraestrutura critica, nao arquivo"

  - name: never_deletes_in_production
    effect: DENY
    match: {action: "*.delete*", environment: ["prod", "production", "producao"]}
    reason: "apagar em producao nao tem desfazer"

  # ---- despachar um agente -----------------------------------------------
  # Permite que a acao seja AVALIADA. Nao e permissao para o agente fazer o que
  # quiser: o que ele pode continua vindo do sandbox, do orcamento, dos limites
  # do workspace e da autonomia -- e nenhum dos quatro vem daqui.
  #
  # Sem esta regra o default DENY vale e o motor nunca despacha: `doctor`
  # reporta BLOCKED_POLICY e a prontidao do agente nunca fica verde. Foi o
  # estado deste arquivo ate o primeiro `regente doctor` de um workspace NOVO
  # ser executado de verdade, no marco 6 -- o mesmo padrao de `approval.decide`
  # e de `workspace.access.*`: cada comando que volta a funcionar mostra a
  # palavra que faltava no vocabulario.
  - name: dispatch_an_agent
    effect: ALLOW
    match: {action: "agent.run"}
    reason: "sem isto o motor nunca despacha, e a fila nunca anda"

  # ---- operar o motor ----------------------------------------------------
  # Ligar, pausar e parar o PROCESSAMENTO. Permite que a acao seja avaliada;
  # nao liga nada. Quem liga e uma pessoa com concessao para isso, e o que
  # executa e um processo que alguem iniciou -- a tela grava intencao, nunca
  # cria processo.
  #
  # Sem esta regra o default DENY vale e o motor nao pode ser desligado por
  # ninguem, que e pior do que nao poder ser ligado: numa emergencia, o botao
  # que falta e o de parar.
  - name: human_operates_the_engine
    effect: ALLOW
    match: {action: "workspace.engine.control"}
    reason: "quem esta de plantao precisa poder pausar sem matar processo"
