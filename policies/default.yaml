# Policy Engine rules.
#
# The default is DENY: an action with no rule allowing it does not happen. The
# rules below open what needs to be open, and nothing more.
#
# The most restrictive wins. If any rule says DENY, the verdict is DENY --
# order in the file does not decide security.
#
# Fields that may appear in `match` (absent = wildcard):
#   action environment resource organization client workspace project agent risk
#
# Match values are data, not prose: "producao" stays in the environment lists
# below so a workspace configured with that environment name is still caught.
# The same spelling is in the risk engine's production factor.

rules:
  # ---- reading: open -----------------------------------------------------
  - name: read_anything
    effect: ALLOW
    match: {action: "*.read"}
    reason: "reading never changes the world"

  - name: read_tasks
    effect: ALLOW
    match: {action: "task.read*"}

  # ---- work in the worker's own area -------------------------------------
  - name: write_in_own_area
    effect: ALLOW
    match: {action: "workspace.write*"}
    reason: "the worker's area is isolated and disposable"

  - name: write_code
    effect: ALLOW
    match: {action: ["repo.branch*", "repo.commit*"]}

  # ---- delivery ----------------------------------------------------------
  - name: publish_work
    effect: ALLOW
    match: {action: ["repo.push*", "repo.pr*"]}
    reason: "a PR is the surface where a human sees the work before it counts"

  - name: comment_and_transition
    effect: ALLOW
    match: {action: "task.write*"}

  # ---- staging: autonomous -----------------------------------------------
  - name: merge_and_deploy_staging
    effect: ALLOW
    match: {action: ["repo.merge", "deploy.staging"], environment: ["staging", "local", "test"]}
    reason: "staging exists to break; waiting for a signature here is the bottleneck the engine removes"

  # ---- production: human authority ---------------------------------------
  # Not distrust of the model: this is where the organisation decided the
  # signature has an owner. High risk does NOT belong here -- risk buys a
  # re-read, not waiting.
  - name: production_needs_signature
    effect: HUMAN_APPROVAL
    match: {action: ["repo.merge", "deploy.*", "cloud.write*"], environment: ["prod", "production", "producao"]}
    reason: "a change in production has a human owner"

  # ---- forbidden ---------------------------------------------------------
  # DENY, and not HUMAN_APPROVAL, because there is no circumstance in which the
  # engine should do this -- not even with authorisation. Whoever needs it does
  # it by hand.
  - name: never_destroys_data
    effect: DENY
    match: {action: ["db.write*", "db.drop*", "db.delete*", "*.destroy", "*.purge", "*.truncate"]}
    reason: "the engine does not write to a database; a migration goes through deploy, with review"

  - name: never_touches_credentials
    effect: DENY
    match: {resource: ["*secret*", "*credential*", "*iam*", "*.env*"]}
    reason: "a credential is critical infrastructure, not a file"

  - name: never_deletes_in_production
    effect: DENY
    match: {action: "*.delete*", environment: ["prod", "production", "producao"]}
    reason: "deleting in production has no undo"
