[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regente"
version = "0.1.0"
description = "An operating system for software engineering agents."
requires-python = ">=3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# The engine depends on neither a UI nor an LLM to run a tick. Extras load only
# for whoever needs them: the Core Engine has to start in an environment with no
# FastAPI and no SDK.
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.3"]

[project.scripts]
regente = "regente.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["regente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Every test here is a function. Without this, pytest tries to collect domain
# classes whose names merely start with "Test" -- `TestResult` is an enum, not
# a suite, and the warning would train everyone to ignore warnings.
python_classes = []
