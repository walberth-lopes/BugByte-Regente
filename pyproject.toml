[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regente"
version = "0.4.0"
description = "Sistema operacional para agentes de engenharia de software."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Walberth Lopes" }]
keywords = ["agentes", "automacao", "engenharia-de-software", "jira", "ci"]
# Havia aqui `Private :: Do Not Upload` -- uma trava deliberada, porque nenhum
# classificador comecado por `Private ::` existe no indice e o servidor recusa o
# upload. Ela saiu com a decisao de publicar.
#
# A trava agora e outra, e esta em `[[tool.uv.index]]` mais abaixo: o alvo de
# publicacao aponta para o TestPyPI, e nao para o PyPI. Um `uv publish` distraido
# sobe para o indice descartavel, e nao queima a versao 0.1.0 no indice real.
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
# UMA dependencia, e ela e um leitor de YAML.
#
# Isto nao e minimalismo por esporte: o Regente e instalado como FERRAMENTA, num
# ambiente isolado, na maquina de quem so quer usa-lo. Cada dependencia a mais e
# um download a mais, uma superficie a mais, e uma chance a mais de o
# `uv tool install` falhar por um motivo que nao tem nada a ver com o produto.
#
# A Mission Control NAO precisa de framework web: ela e servida pelo
# `http.server` da biblioteca padrao, e a tela ja vai construida dentro do
# pacote. Houve aqui um extra `ui = [fastapi, uvicorn]` e um `llm = [anthropic]`
# que NENHUM modulo importava -- dependencia declarada e nao usada e uma mentira
# no pacote, e essa em particular ensinava que a tela precisa de um servidor de
# aplicacao para subir.
dependencies = [
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.urls]
Repositorio = "https://github.com/walberth-lopes/BugByte-Regente"

[project.scripts]
regente = "regente.cli:main"

# ONDE O `uv publish` PUBLICA.
#
# O alvo e o PyPI real, por decisao explicita. Foi o TestPyPI enquanto a decisao
# era ensaiar -- e o ensaio pagou por si: instalar do indice mostrou os rotulos
# da faixa de metricas cortados, um defeito que nao aparecia rodando do disco.
#
# O que muda agora e o custo do erro. Uma versao publicada aqui NAO pode ser
# substituida: `0.1.1` fica sendo `0.1.1` para sempre, e corrigir e publicar
# `0.1.2`. Por isso o alvo continua declarado AQUI, e nao passado na linha de
# comando -- um argumento esquecido nao pode ser a diferenca entre os dois
# indices.
#
# E um `publish-url`, e NAO um `[[tool.uv.index]]`. A diferenca mordeu de
# verdade: declarar um indice chamado `pypi-real` apontando para
# `https://pypi.org/simple/` quebrava a resolucao DENTRO do repositorio --
# `uv tool install regente` respondia "not found in the package registry" aqui
# e funcionava em qualquer outra pasta. Publicar nao precisa de um indice de
# leitura; precisa de um endereco de envio.
#
# O TestPyPI segue disponivel para ensaiar antes de cada versao:
#     uv publish --publish-url https://test.pypi.org/legacy/
[tool.uv]
publish-url = "https://upload.pypi.org/legacy/"

[tool.hatch.build.targets.wheel]
# `regente/` inteiro, e isso inclui `app/ui/` -- a Mission Control ja construida.
#
# O build da tela vai VERSIONADO no repositorio de proposito: construir na
# instalacao faria `uv tool install regente` exigir Node na maquina de quem so
# quer abrir a interface.
packages = ["regente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Registered so the marker is a contract rather than a typo pytest warns about.
# `slow` marks the tests that spawn real processes and contend for real: they
# belong in the default run -- concurrency proven only when someone remembers a
# flag is concurrency unproven -- but naming them lets a tight loop skip them
# with `-m "not slow"`.
markers = ["slow: spawns real processes; seconds rather than milliseconds"]
# Every test here is a function. Without this, pytest tries to collect domain
# classes whose names merely start with "Test" -- `TestResult` is an enum, not
# a suite, and the warning would train everyone to ignore warnings.
python_classes = []
